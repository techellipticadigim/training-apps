<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heap Visualization - Collection Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link">← Back to Index</a>
            <h1>⛰️ Heap</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <div class="control-group">
                    <h3>Input</h3>
                    <div class="input-group">
                        <label for="inputValue">Value (comma separated)</label>
                        <input type="text" id="inputValue" placeholder="e.g., 4,1,3,2">
                    </div>
                </div>

                <div class="control-group">
                    <h3>Operations</h3>
                    <div class="operations" id="operations"></div>
                </div>

                <div class="control-group">
                    <h3>Examples</h3>
                    <div class="examples" id="examples"></div>
                </div>
            </div>

            <div class="visualization-area" id="visualization"></div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        class HeapVisualizer extends BaseVisualizer {
            constructor() {
                super();
                this.heap = [];
                this.isMinHeap = true;
            }

            getOperations() {
                return [
                    { name: 'insert', label: 'Insert', type: 'primary' },
                    { name: 'extract', label: 'Extract Min/Max', type: 'danger' },
                    { name: 'clear', label: 'Clear', type: 'secondary' }
                ];
            }

            getExamples() {
                return [
                    { label: '4,1,3,2', data: [4, 1, 3, 2] },
                    { label: '10,5,15,3,7', data: [10, 5, 15, 3, 7] }
                ];
            }

            parent(i) { return Math.floor((i - 1) / 2); }
            left(i) { return 2 * i + 1; }
            right(i) { return 2 * i + 2; }

            insert(value) {
                this.heap.push(value);
                this.heapifyUp(this.heap.length - 1);
            }

            heapifyUp(i) {
                while (i > 0) {
                    const p = this.parent(i);
                    if ((this.isMinHeap && this.heap[i] >= this.heap[p]) ||
                        (!this.isMinHeap && this.heap[i] <= this.heap[p])) break;
                    [this.heap[i], this.heap[p]] = [this.heap[p], this.heap[i]];
                    i = p;
                }
            }

            executeOperation(op, values, key) {
                if (op === 'insert' && values.length > 0) {
                    values.forEach(v => this.insert(v));
                } else if (op === 'extract') {
                    if (this.heap.length === 0) {
                        alert('Heap is empty');
                        return;
                    }
                    const root = this.heap[0];
                    this.heap[0] = this.heap[this.heap.length - 1];
                    this.heap.pop();
                    if (this.heap.length > 0) this.heapifyDown(0);
                    alert(`Extracted: ${root}`);
                } else if (op === 'clear') {
                    this.heap = [];
                }
                this.render();
            }

            heapifyDown(i) {
                while (true) {
                    let smallest = i;
                    const l = this.left(i);
                    const r = this.right(i);
                    
                    if (l < this.heap.length && 
                        ((this.isMinHeap && this.heap[l] < this.heap[smallest]) ||
                         (!this.isMinHeap && this.heap[l] > this.heap[smallest]))) {
                        smallest = l;
                    }
                    if (r < this.heap.length && 
                        ((this.isMinHeap && this.heap[r] < this.heap[smallest]) ||
                         (!this.isMinHeap && this.heap[r] > this.heap[smallest]))) {
                        smallest = r;
                    }
                    if (smallest === i) break;
                    [this.heap[i], this.heap[smallest]] = [this.heap[smallest], this.heap[i]];
                    i = smallest;
                }
            }

            render() {
                const container = document.getElementById('visualization');
                container.innerHTML = `
                    <div class="description">
                        <strong>Heap:</strong> Complete binary tree stored as array. ${this.isMinHeap ? 'Min' : 'Max'} heap property maintained.
                        <br>Size: ${this.heap.length}
                    </div>
                    <div class="heap-container">
                        <div class="heap-array" id="heapArray"></div>
                    </div>
                    ${this.renderComplexity([
                        { operation: 'Insert', complexity: 'O(log n)' },
                        { operation: 'Extract', complexity: 'O(log n)' },
                        { operation: 'Peek', complexity: 'O(1)' }
                    ])}
                    ${this.renderCodeSnippet('JavaScript', `// Min Heap
class MinHeap {
    constructor() {
        this.heap = [];
    }
    
    parent(i) { return Math.floor((i - 1) / 2); }
    left(i) { return 2 * i + 1; }
    right(i) { return 2 * i + 2; }
    
    insert(value) {
        this.heap.push(value);
        this.heapifyUp(this.heap.length - 1);
    }
    
    heapifyUp(i) {
        while (i > 0 && this.heap[i] < this.heap[this.parent(i)]) {
            const p = this.parent(i);
            [this.heap[i], this.heap[p]] = [this.heap[p], this.heap[i]];
            i = p;
        }
    }
}`)}
                `;

                const arrayContainer = document.getElementById('heapArray');
                arrayContainer.innerHTML = '';
                this.heap.forEach((value, index) => {
                    const cell = document.createElement('div');
                    cell.className = 'array-cell';
                    cell.classList.add('active');
                    cell.innerHTML = `
                        <span class="index">${index}</span>
                        <span class="value">${value}</span>
                    `;
                    arrayContainer.appendChild(cell);
                });
            }
        }

        const visualizer = new HeapVisualizer();
        visualizer.render();

        function setupOperations() {
            const opsContainer = document.getElementById('operations');
            opsContainer.innerHTML = '';
            visualizer.getOperations().forEach(op => {
                const btn = document.createElement('button');
                btn.className = `btn btn-${op.type || 'primary'}`;
                btn.textContent = op.label;
                btn.onclick = () => {
                    const inputValue = document.getElementById('inputValue').value;
                    const values = parseInput(inputValue, 'number');
                    if (values.length === 0 && !['extract', 'clear'].includes(op.name)) {
                        alert('Please enter a value');
                        return;
                    }
                    visualizer.executeOperation(op.name, values);
                };
                opsContainer.appendChild(btn);
            });
        }

        function setupExamples() {
            const examplesContainer = document.getElementById('examples');
            examplesContainer.innerHTML = '';
            visualizer.getExamples().forEach(example => {
                const btn = document.createElement('button');
                btn.className = 'example-btn';
                btn.textContent = example.label;
                btn.onclick = () => {
                    document.getElementById('inputValue').value = example.data.join(',');
                    visualizer.executeOperation('insert', example.data);
                };
                examplesContainer.appendChild(btn);
            });
        }

        setupOperations();
        setupExamples();

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton();
        }

        function updateThemeButton() {
            const btn = document.querySelector('.theme-toggle');
            if (btn) {
                btn.textContent = document.body.getAttribute('data-theme') === 'dark' 
                    ? '☀️ Light Mode' 
                    : '🌙 Dark Mode';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeButton();
        });
    </script>
</body>
</html>
