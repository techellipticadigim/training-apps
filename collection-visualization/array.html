<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Visualization - Collection Visualizer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Monaco Editor CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link">← Back to Index</a>
            <h1>📋 Array</h1>
            <div style="display: flex; align-items: center; gap: 16px;">
                <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
            </div>
        </div>

        <div class="main-content">
            <div class="visualization-area">
                <div id="visualization"></div>
                
                <div class="code-terminal-wrapper">
                    <div class="code-editor-section">
                        <div class="code-editor-header">
                            <div class="language-tabs">
                                <button class="language-tab active" data-language="java" onclick="switchLanguageTab('java')">
                                    ☕ Java
                                </button>
                                <!-- Future tabs can be added here -->
                                <!-- <button class="language-tab" data-language="python" onclick="switchLanguageTab('python')">
                                    🐍 Python
                                </button>
                                <button class="language-tab" data-language="javascript" onclick="switchLanguageTab('javascript')">
                                    📜 JavaScript
                                </button> -->
                            </div>
                            <button class="btn btn-primary" onclick="runCode()">▶ Run Code</button>
                        </div>
                        <div class="code-editor-tabs-content">
                            <div class="code-editor-tab-pane active" id="tab-java">
                                <div id="javaCodeEditor" class="monaco-editor-container"></div>
                            </div>
                            <!-- Future tab panes can be added here -->
                            <!-- <div class="code-editor-tab-pane" id="tab-python">
                                <div id="pythonCodeEditor" class="monaco-editor-container"></div>
                            </div>
                            <div class="code-editor-tab-pane" id="tab-javascript">
                                <div id="javascriptCodeEditor" class="monaco-editor-container"></div>
                            </div> -->
                        </div>
                        <div id="codeOutput" class="code-output"></div>
                    </div>
                    
                    <div class="terminal-section">
                        <div class="terminal-header">
                            <div class="terminal-title">
                                <span class="terminal-icon">💻</span>
                                <span>Terminal</span>
                            </div>
                            <div class="terminal-controls">
                                <button class="terminal-font-btn" onclick="decreaseTerminalFont()" title="Decrease Font Size">A-</button>
                                <button class="terminal-font-btn" onclick="increaseTerminalFont()" title="Increase Font Size">A+</button>
                                <button class="terminal-clear-btn" onclick="clearTerminal()" title="Clear Terminal">🗑️</button>
                            </div>
                        </div>
                        <div id="terminal" class="terminal"></div>
                    </div>
                </div>
                
                <div id="complexitySection" class="complexity-section"></div>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <!-- Monaco Editor JS -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.min.js"></script>
    <script>
        let editors = {}; // Store editors for each language
        let currentLanguage = 'java'; // Current active language tab
        
        // Initialize Monaco Editor after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            // Configure Monaco Editor loader
            require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
            
            // Initialize Monaco Editor
            require(['vs/editor/editor.main'], function () {
                initializeEditor('java');
                
                // Update editor theme when page theme changes
                const observer = new MutationObserver(() => {
                    Object.values(editors).forEach(editor => {
                        if (editor) {
                            const theme = document.body.getAttribute('data-theme') === 'dark' ? 'vs-dark' : 'vs';
                            monaco.editor.setTheme(theme);
                        }
                    });
                });
                observer.observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
                
                // Run the default code once after editor is initialized
                setTimeout(() => {
                    if (typeof runCode === 'function' && editors['java']) {
                        // Set default language to java
                        if (visualizer) {
                            visualizer.language = 'java';
                        }
                        runCode();
                    }
                }, 800); // Delay to ensure editor and language setup are complete
            });
            
            // Function to initialize editor for a specific language
            function initializeEditor(language) {
                const editorId = language + 'CodeEditor';
                const editorElement = document.getElementById(editorId);
                if (!editorElement) {
                    console.error(`Code editor element not found for ${language}`);
                    return;
                }
                
                // Default code templates for each language
                const codeTemplates = {
                    java: `// Write your Java array code here
public class ArrayDemo {
    public static void main(String[] args) {
        // Example: Create an array
        int[] arr = new int[5];
        
        // Add values to array
        arr[0] = 10;
        arr[1] = 20;
        arr[2] = 30;
        arr[3] = 40;
        arr[4] = 50;
        
        // Access array elements
        System.out.println("First element: " + arr[0]);
        
        // Iterate through array
        for (int i = 0; i < arr.length; i++) {
            System.out.println("arr[" + i + "] = " + arr[i]);
        }
    }
}`,
                    python: `# Write your Python array code here
# Example: Create a list
arr = [10, 20, 30, 40, 50]

# Access array elements
print("First element:", arr[0])

# Iterate through array
for i, value in enumerate(arr):
    print(f"arr[{i}] = {value}")`,
                    javascript: `// Write your JavaScript array code here
// Example: Create an array
const arr = [10, 20, 30, 40, 50];

// Access array elements
console.log("First element: " + arr[0]);

// Iterate through array
for (let i = 0; i < arr.length; i++) {
    console.log(\`arr[\${i}] = \${arr[i]}\`);
}`
                };
                
                const editor = monaco.editor.create(editorElement, {
                    value: codeTemplates[language] || codeTemplates.java,
                    language: language,
                    theme: document.body.getAttribute('data-theme') === 'dark' ? 'vs-dark' : 'vs',
                    automaticLayout: true,
                    fontSize: 14,
                    minimap: { enabled: true },
                    scrollBeyondLastLine: false,
                    wordWrap: 'on',
                    formatOnPaste: true,
                    formatOnType: true
                });
                
                // Add Enter key listener to run code automatically
                let lastRunTime = 0;
                const RUN_DEBOUNCE_MS = 800;
                let runTimeout = null;
                
                editor.onKeyDown(function(e) {
                    if (e.keyCode === monaco.KeyCode.Enter && !e.ctrlKey && !e.metaKey && !e.shiftKey && !e.altKey) {
                        if (runTimeout) {
                            clearTimeout(runTimeout);
                        }
                        runTimeout = setTimeout(function() {
                            const now = Date.now();
                            if (now - lastRunTime >= RUN_DEBOUNCE_MS) {
                                lastRunTime = now;
                                runCode();
                            }
                        }, 100);
                    }
                });
                
                editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, function() {
                    if (runTimeout) {
                        clearTimeout(runTimeout);
                    }
                    runCode();
                }, 'runCodeCtrl');
                
                editors[language] = editor;
            }
            
            // Function to switch language tabs
            window.switchLanguageTab = function(language) {
                currentLanguage = language;
                
                // Update tab buttons
                document.querySelectorAll('.language-tab').forEach(tab => {
                    if (tab.dataset.language === language) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
                
                // Update tab panes
                document.querySelectorAll('.code-editor-tab-pane').forEach(pane => {
                    if (pane.id === 'tab-' + language) {
                        pane.classList.add('active');
                    } else {
                        pane.classList.remove('active');
                    }
                });
                
                // Initialize editor if not already initialized
                if (!editors[language]) {
                    initializeEditor(language);
                }
                
                // Update editor layout when switching tabs
                setTimeout(() => {
                    if (editors[language]) {
                        editors[language].layout();
                    }
                }, 100);
            };
        });
        
        // Function to update code editor language and example code
        function updateCodeEditorLanguage(language) {
            // This function is kept for backward compatibility
            // The language switching is now handled by tabs
            if (currentLanguage !== language && editors[language]) {
                switchLanguageTab(language);
            }
        }
        
        // Terminal functions
        window.displayTerminalOutput = function(outputs) {
            const terminal = document.getElementById('terminal');
            if (!terminal) return;
            
            // Remove placeholder if exists
            const placeholder = terminal.querySelector('.terminal-line[style*="color: #666"]');
            if (placeholder) {
                placeholder.remove();
            }
            
            if (outputs && outputs.length > 0) {
                outputs.forEach(output => {
                    const line = document.createElement('div');
                    // Check if output is an error message
                    const isError = output.includes('Exception') || 
                                   output.includes('IndexOutOfBoundsException') || 
                                   output.includes('RangeError') ||
                                   output.includes('Error:');
                    line.className = isError ? 'terminal-line terminal-error' : 'terminal-line';
                    line.textContent = output;
                    terminal.appendChild(line);
                });
                // Auto scroll to bottom
                terminal.scrollTop = terminal.scrollHeight;
            } else {
                // Show placeholder if no output
                if (terminal.children.length === 0) {
                    terminal.innerHTML = '<div class="terminal-line" style="color: #666; font-style: italic;">No output yet. Run your code to see System.out.println output here.</div>';
                }
            }
        };
        
        window.displayTerminalError = function(errorMessage) {
            const terminal = document.getElementById('terminal');
            if (!terminal) return;
            
            // Remove placeholder if exists
            const placeholder = terminal.querySelector('.terminal-line[style*="color: #666"]');
            if (placeholder) {
                placeholder.remove();
            }
            
            const errorLine = document.createElement('div');
            errorLine.className = 'terminal-line terminal-error';
            errorLine.textContent = errorMessage;
            terminal.appendChild(errorLine);
            
            // Auto scroll to bottom
            terminal.scrollTop = terminal.scrollHeight;
        };
        
        window.clearTerminal = function() {
            const terminal = document.getElementById('terminal');
            if (terminal) {
                terminal.innerHTML = '';
            }
        };
        
        // Terminal font size functions
        window.increaseTerminalFont = function() {
            const terminal = document.getElementById('terminal');
            if (!terminal) return;
            
            const currentSize = parseInt(getComputedStyle(terminal).fontSize) || 13;
            const newSize = Math.min(currentSize + 2, 24); // Max 24px
            terminal.style.fontSize = newSize + 'px';
            localStorage.setItem('terminalFontSize', newSize);
        };
        
        window.decreaseTerminalFont = function() {
            const terminal = document.getElementById('terminal');
            if (!terminal) return;
            
            const currentSize = parseInt(getComputedStyle(terminal).fontSize) || 13;
            const newSize = Math.max(currentSize - 2, 10); // Min 10px
            terminal.style.fontSize = newSize + 'px';
            localStorage.setItem('terminalFontSize', newSize);
        };
        
        // Initialize terminal with placeholder and restore font size
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                const terminal = document.getElementById('terminal');
                if (terminal) {
                    // Restore saved font size
                    const savedFontSize = localStorage.getItem('terminalFontSize');
                    if (savedFontSize) {
                        terminal.style.fontSize = savedFontSize + 'px';
                    }
                    
                    // Show placeholder if empty
                    if (terminal.children.length === 0) {
                        terminal.innerHTML = '<div class="terminal-line" style="color: #666; font-style: italic;">No output yet. Run your code to see System.out.println output here.</div>';
                    }
                }
            }, 100);
        });
        
        // Function to run code (works with current active language)
        function runCode() {
            // Clear terminal on each run
            clearTerminal();
            const editor = editors[currentLanguage];
            if (!editor) {
                alert('Code editor is not ready yet. Please wait a moment.');
                return;
            }
            
            const code = editor.getValue();
            const outputDiv = document.getElementById('codeOutput');
            
            // Clear previous output
            outputDiv.innerHTML = '<div class="code-output-header">Output:</div>';
            
            try {
                // Get current language from visualizer (for array type, not code editor language)
                const arrayLanguage = visualizer.language || 'java';
                
                // Parse code and extract array operations
                const arrayInfo = parseCode(code, currentLanguage);
                
                if (arrayInfo.error) {
                    // Show error in output
                    outputDiv.innerHTML += `<div class="error-message">❌ ${arrayInfo.error}</div>`;
                    
                    // Show error in terminal
                    displayTerminalError(arrayInfo.error);
                    
                    // Also show error in visualization area
                    visualizer.errorMessage = arrayInfo.error;
                    visualizer.render();
                    
                    return;
                } else {
                    // Clear any previous error messages
                    visualizer.errorMessage = null;
                }
                
                // Display parsed information
                let outputHTML = '<div class="code-analysis">';
                
                // Clear previous arrays and store all detected arrays
                visualizer.arrays = [];
                
                if (arrayInfo.arrayDeclarations.length > 0) {
                    outputHTML += '<h4>📊 Detected Arrays:</h4><ul>';
                    arrayInfo.arrayDeclarations.forEach(arr => {
                        if (arr.dimensions === 2) {
                            // Handle 2D array
                            outputHTML += `<li>${arr.name}: ${arr.type}[][] size = ${arr.rows}x${arr.cols}</li>`;
                            
                            visualizer.arrays.push({
                                name: arr.name,
                                type: arr.type,
                                dimensions: 2,
                                rows: arr.rows,
                                cols: arr.cols,
                                data: arr.values || [],
                                language: arrayLanguage
                            });
                        } else {
                            // Handle 1D array
                            outputHTML += `<li>${arr.name}: ${arr.type}[] size = ${arr.size}</li>`;
                            
                            // Process each array and add to arrays collection
                            if (arr.values !== undefined && arr.values !== null) {
                                const values = arr.values;
                                let capacity = 0;
                                let size = 0;
                                let data = [];
                                
                                // Determine capacity and size based on language
                                if (arrayLanguage === 'javascript') {
                                    // JavaScript: dynamic array - set capacity based on actual values
                                    if (Array.isArray(values)) {
                                        size = values.length;
                                        capacity = size;
                                    } else if (Object.keys(values).length > 0) {
                                        const maxIdx = Math.max(...Object.keys(values).map(k => parseInt(k)).filter(k => !isNaN(k)));
                                        size = maxIdx >= 0 ? maxIdx + 1 : 0;
                                        capacity = size;
                                    }
                                    data = new Array(capacity);
                                } else {
                                    // Java: use declared size
                                    capacity = arr.size;
                                    size = 0;
                                    data = new Array(capacity);
                                }
                                
                                // Handle both array and object-based values
                                let maxIndex = -1;
                                
                                if (Array.isArray(values)) {
                                    // If values is an array (from curly brace initialization or JavaScript array literal)
                                    values.forEach((val, idx) => {
                                        if (idx >= 0 && idx < capacity) {
                                            data[idx] = val;
                                            maxIndex = Math.max(maxIndex, idx);
                                        } else if (idx < 0 || (arrayLanguage === 'java' && idx >= capacity)) {
                                            const errorMsg = arrayLanguage === 'java' 
                                                ? `IndexOutOfBoundsException: Index ${idx} out of bounds for length ${capacity}`
                                                : `RangeError: Index ${idx} out of bounds`;
                                            visualizer.errorMessage = errorMsg;
                                            displayTerminalError(errorMsg);
                                        }
                                    });
                                } else {
                                    // If values is an object (from individual assignments)
                                    for (let key in values) {
                                        const idx = parseInt(key);
                                        if (!isNaN(idx) && idx >= 0) {
                                            // For JavaScript, dynamically grow capacity if needed
                                            if (arrayLanguage === 'javascript' && idx >= capacity) {
                                                const newCapacity = Math.max(capacity * 2, idx + 1);
                                                const newData = new Array(newCapacity);
                                                for (let i = 0; i < capacity; i++) {
                                                    newData[i] = data[i];
                                                }
                                                data = newData;
                                                capacity = newCapacity;
                                            }
                                            
                                            if (idx < capacity) {
                                                data[idx] = values[idx];
                                                maxIndex = Math.max(maxIndex, idx);
                                            } else if (arrayLanguage === 'java') {
                                                const errorMsg = `IndexOutOfBoundsException: Index ${idx} out of bounds for length ${capacity}`;
                                                visualizer.errorMessage = errorMsg;
                                                displayTerminalError(errorMsg);
                                            }
                                        } else if (!isNaN(idx) && idx < 0) {
                                            const errorMsg = arrayLanguage === 'java' 
                                                ? `IndexOutOfBoundsException: Index ${idx} out of bounds`
                                                : `RangeError: Index ${idx} out of bounds`;
                                            visualizer.errorMessage = errorMsg;
                                            displayTerminalError(errorMsg);
                                        }
                                    }
                                }
                                
                                // Set size to maxIndex + 1 if values exist, otherwise 0
                                size = maxIndex >= 0 ? maxIndex + 1 : 0;
                                
                                // For JavaScript empty arrays, ensure capacity is also 0
                                if (arrayLanguage === 'javascript' && size === 0 && (Array.isArray(values) ? values.length === 0 : Object.keys(values).length === 0)) {
                                    capacity = 0;
                                    data = [];
                                }
                                
                                // Add array to collection
                                visualizer.arrays.push({
                                    name: arr.name,
                                    type: arr.type,
                                    size: size,
                                    capacity: capacity,
                                    data: data,
                                    dimensions: 1,
                                    language: arrayLanguage
                                });
                            } else if (arr.values !== undefined && arr.values !== null && arrayLanguage === 'javascript') {
                                // Handle empty JavaScript arrays
                                if ((Array.isArray(arr.values) && arr.values.length === 0) || (typeof arr.values === 'object' && Object.keys(arr.values).length === 0)) {
                                    visualizer.arrays.push({
                                        name: arr.name,
                                        type: arr.type,
                                        size: 0,
                                        capacity: 0,
                                        data: [],
                                        dimensions: 1,
                                        language: arrayLanguage
                                    });
                                }
                            } else {
                                // Empty array declaration (Java)
                                visualizer.arrays.push({
                                    name: arr.name,
                                    type: arr.type,
                                    size: 0,
                                    capacity: arr.size,
                                    data: new Array(arr.size),
                                    dimensions: 1,
                                    language: arrayLanguage
                                });
                            }
                        }
                    });
                    outputHTML += '</ul>';
                    
                            // If there was an error, render it and return
                            if (visualizer.errorMessage) {
                                displayTerminalError(visualizer.errorMessage);
                                visualizer.render();
                                return;
                            }
                    
                    // Render all arrays
                    visualizer.render();
                }
                
                if (arrayInfo.operations.length > 0) {
                    outputHTML += '<h4>🔍 Detected Operations:</h4><ul>';
                    arrayInfo.operations.forEach(op => {
                        outputHTML += `<li>${op}</li>`;
                    });
                    outputHTML += '</ul>';
                }
                
                if (arrayInfo.output.length > 0) {
                    outputHTML += '<h4>📝 Simulated Output:</h4><pre>' + arrayInfo.output.join('\\n') + '</pre>';
                }
                
                outputHTML += '</div>';
                outputDiv.innerHTML += outputHTML;
                
                // Display output in terminal
                displayTerminalOutput(arrayInfo.output);
                
                // Show success message
                outputDiv.innerHTML += '<div class="success-message">✅ Code parsed successfully! Array visualization updated.</div>';
                
                // Clear any previous error messages since code ran successfully
                if (visualizer.errorMessage) {
                    visualizer.errorMessage = null;
                    visualizer.render();
                }
                
            } catch (error) {
                const errorMsg = `Error: ${error.message}`;
                outputDiv.innerHTML += `<div class="error-message">❌ ${errorMsg}</div>`;
                
                // Show error in terminal
                displayTerminalError(errorMsg);
                
                // Show error in visualization as well
                visualizer.errorMessage = errorMsg;
                visualizer.render();
            }
        }
        
        // Function to parse code (Java or JavaScript) and extract array information
        function parseCode(code, language = 'java') {
            const result = {
                arrayDeclarations: [],
                operations: [],
                output: [],
                error: null
            };
            
            try {
                // Remove comments
                code = code.replace(/\/\/.*/g, '').replace(/\/\*[\s\S]*?\*\//g, '');
                
                // Find 2D array initialization: int[][] arr = {{1,2,3}, {4,5,6}}; or int[][] ar3 = { arr, arr1 };
                const array2DInitRegex = /(\w+)\s*\[\]\s*\[\]\s*(\w+)\s*=\s*\{([^}]+)\}/g;
                let match;
                while ((match = array2DInitRegex.exec(code)) !== null) {
                    const type = match[1];
                    const name = match[2];
                    const fullMatch = match[0];
                    
                    // Extract the content between outer braces
                    const contentMatch = fullMatch.match(/=\s*\{([\s\S]+)\}/);
                    if (!contentMatch) continue;
                    
                    const valuesStr = contentMatch[1].trim();
                    
                    // Check if it's array references (e.g., { arr, arr1 }) or nested braces (e.g., {{1,2}, {3,4}})
                    const hasNestedBraces = valuesStr.includes('{');
                    const rows = [];
                    
                    if (hasNestedBraces) {
                        // Parse nested braces: {{1,2,3}, {4,5,6}}
                        let currentRow = '';
                        let braceDepth = 0;
                        let inRow = false;
                        
                        for (let i = 0; i < valuesStr.length; i++) {
                            const char = valuesStr[i];
                            if (char === '{') {
                                braceDepth++;
                                if (braceDepth === 1) {
                                    currentRow = '';
                                    inRow = true;
                                    continue;
                                }
                            } else if (char === '}') {
                                braceDepth--;
                                if (braceDepth === 0 && inRow) {
                                    // Parse row values with type checking
                                    const rowValues = [];
                                    const rowValueStrings = currentRow.split(',');
                                    const isStringType = type.toLowerCase() === 'string';
                                    
                                    for (let v of rowValueStrings) {
                                        const trimmed = v.trim();
                                        if (trimmed === '') continue;
                                        
                                        const isQuotedString = trimmed.match(/^["'].*["']$/);
                                        const num = Number(trimmed);
                                        const isNumber = !isNaN(num) && trimmed !== '' && !isQuotedString;
                                        
                                        // Type validation
                                        if (isStringType) {
                                            if (isQuotedString) {
                                                rowValues.push(trimmed.replace(/["']/g, ''));
                                            } else if (isNumber) {
                                                const errorMsg = language === 'java' 
                                                    ? `Type mismatch: cannot convert int to String in array ${name}`
                                                    : `TypeError: Cannot assign number to string array`;
                                                result.error = errorMsg;
                                                return result;
                                            } else {
                                                rowValues.push(trimmed);
                                            }
                                        } else {
                                            if (isQuotedString) {
                                                const errorMsg = language === 'java' 
                                                    ? `Type mismatch: cannot convert String to ${type} in array ${name}`
                                                    : `TypeError: Cannot assign string to number array`;
                                                result.error = errorMsg;
                                                return result;
                                            } else if (isNumber) {
                                                rowValues.push(num);
                                            } else {
                                                const parsedNum = Number(trimmed);
                                                if (!isNaN(parsedNum)) {
                                                    rowValues.push(parsedNum);
                                                } else {
                                                    rowValues.push(trimmed);
                                                }
                                            }
                                        }
                                    }
                                    
                                    rows.push(rowValues);
                                    currentRow = '';
                                    inRow = false;
                                    continue;
                                }
                            }
                            if (inRow && braceDepth > 0) {
                                currentRow += char;
                            }
                        }
                    } else {
                        // Parse array references: { arr, arr1 }
                        // Store as strings first, will be resolved in second pass
                        const arrayRefs = valuesStr.split(',').map(ref => ref.trim()).filter(ref => ref !== '');
                        
                        // Store array names as strings - they'll be resolved in second pass
                        arrayRefs.forEach(refName => {
                            rows.push(refName); // Store as string reference
                        });
                    }
                    
                    if (rows.length > 0) {
                        // If it's array references, cols will be determined after resolution
                        // For nested braces, calculate maxCols now
                        const maxCols = hasNestedBraces 
                            ? Math.max(...rows.map(r => Array.isArray(r) ? r.length : 0))
                            : 0; // Will be set in second pass
                        
                        result.arrayDeclarations.push({
                            type: type,
                            name: name,
                            size: rows.length,
                            dimensions: 2,
                            rows: rows.length,
                            cols: maxCols,
                            values: rows,
                            needsResolution: !hasNestedBraces // Flag for second pass
                        });
                        
                        result.operations.push(`Initialization: ${name} = ${hasNestedBraces ? '{{...}, ...}' : '{array refs}'} (2D array)`);
                    }
                }
                
                // Find 1D array initialization with curly braces: int[] marks = {10,30,40,50,8};
                const arrayInitRegex = /(\w+)\s*\[\]\s*(\w+)\s*=\s*\{([^}]+)\}/g;
                while ((match = arrayInitRegex.exec(code)) !== null) {
                    const type = match[1];
                    const name = match[2];
                    const valuesStr = match[3].trim();
                    
                    // Skip if this was already processed as 2D array
                    const existing2D = result.arrayDeclarations.find(a => a.name === name && a.dimensions === 2);
                    if (existing2D) continue;
                    
                    // Parse values from the curly braces with type checking

                                    if (value !== undefined && value !== null) {
                                        result.output.push(String(value));
                                    } else {
                                        result.output.push('null');
                                    }
                                } else {
                                    // Plain string or other content
                                    const cleaned = content.replace(/^["']|["']$/g, '').replace(/`/g, '');
                                    if (cleaned.trim()) {
                                        result.output.push(cleaned);
                                    }
                                }
                            }
                        }
                    }
                }
                
                // Find for loops that iterate arrays - handle println statements inside loops
                const forLoopMatches = code.match(/for\s*\([^)]*\)\s*\{[^}]*\}/g);
                let loopOutputGenerated = false;
                
                if (forLoopMatches && forLoopMatches.length > 0) {
                    result.operations.push('Loop iteration detected');
                    
                    // Check if there's a System.out.println inside the loop
                    forLoopMatches.forEach(loopBlock => {
                        // Extract println statements from inside the loop
                        const printlnInLoop = loopBlock.match(/System\.out\.println\s*\([^)]+\)/g);
                        
                        if (printlnInLoop && printlnInLoop.length > 0) {
                            loopOutputGenerated = true;
                            
                            // Process each println in the loop
                            printlnInLoop.forEach(printStmt => {
                                const printContent = printStmt.match(/\(([^)]+)\)/);
                                if (printContent) {
                                    const content = printContent[1];
                                    
                                    // Extract array variable name from the println content (e.g., arr[i])
                                    // This is more reliable than parsing the loop header
                                    const arrMatch = content.match(/(\w+)\s*\[\s*\w+\s*\]/);
                                    let arrVarName = null;
                                    if (arrMatch) {
                                        arrVarName = arrMatch[1];
                                    } else {
                                        // Fallback: try to extract from loop header - handle both < and <=
                                        const loopVarMatch = loopBlock.match(/for\s*\([^)]*(\w+)\s*=\s*\d+\s*;\s*\1\s*[<<=]\s*(\w+)\.length/);
                                        if (loopVarMatch) {
                                            arrVarName = loopVarMatch[2];
                                        }
                                    }
                                    
                                    if (arrVarName) {
                                        const arrDecl = result.arrayDeclarations.find(a => a.name === arrVarName);
                                        // Check if array exists and has values
                                        if (arrDecl) {
                                            // Get array length - handle both array and object-based values
                                            let arrayLength = 0;
                                            let valuesArray = [];
                                            
                                            if (arrDecl.values) {
                                                if (Array.isArray(arrDecl.values)) {
                                                    arrayLength = arrDecl.values.length;
                                                    valuesArray = arrDecl.values;
                                                } else if (typeof arrDecl.values === 'object') {
                                                    const keys = Object.keys(arrDecl.values).map(k => parseInt(k)).filter(k => !isNaN(k));
                                                    if (keys.length > 0) {
                                                        arrayLength = Math.max(...keys) + 1;
                                                        valuesArray = new Array(arrayLength);
                                                        for (let key in arrDecl.values) {
                                                            const idx = parseInt(key);
                                                            if (!isNaN(idx)) {
                                                                valuesArray[idx] = arrDecl.values[key];
                                                            }
                                                        }
                                                    }
                                                }
                                            } else if (arrDecl.size) {
                                                // Array declared but not initialized
                                                arrayLength = arrDecl.size;
                                                valuesArray = new Array(arrayLength);
                                            }
                                            
                                            if (arrayLength > 0) {
                                                // Detect reverse loop: check for i-- and i >= 0 or i = arr.length-1 pattern
                                                const hasDecrement = loopBlock.includes('--');
                                                const hasGreaterEqual = loopBlock.match(/\w+\s*>=\s*\d+/);
                                                const startsFromLength = loopBlock.match(/\w+\s*=\s*\w+\.length\s*-\s*\d+/);
                                                
                                                const isReverseLoop = hasDecrement && (hasGreaterEqual || startsFromLength);
                                                
                                                // Check if loop uses <= instead of < (for forward) or >= (for reverse)
                                                const usesLessThanOrEqual = loopBlock.includes('<=');
                                                const usesGreaterThanOrEqual = loopBlock.includes('>=');
                                                
                                                // Process the println format
                                                let errorOccurred = false;
                                                
                                                // Create array of indices to iterate in correct order
                                                const indices = [];
                                                
                                                if (isReverseLoop) {
                                                    // Reverse loop: iterate from length-1 down to 0
                                                    // Extract start value (e.g., arr.length-1)
                                                    let startValue = arrayLength - 1;
                                                    const startMatch = loopBlock.match(/\w+\s*=\s*(\w+)\.length\s*-\s*(\d+)/);
                                                    if (startMatch) {
                                                        const subtractValue = parseInt(startMatch[2]) || 0;
                                                        startValue = arrayLength - subtractValue;
                                                    }
                                                    
                                                    // Extract end condition
                                                    let endValue = -1; // Default: >= 0 means go to -1
                                                    if (usesGreaterThanOrEqual) {
                                                        const endMatch = loopBlock.match(/\w+\s*>=\s*(\d+)/);
                                                        if (endMatch) {
                                                            endValue = parseInt(endMatch[1]) - 1;
                                                        }
                                                    } else {
                                                        // > 0 means go to 0
                                                        const endMatch = loopBlock.match(/\w+\s*>\s*(\d+)/);
                                                        if (endMatch) {
                                                            endValue = parseInt(endMatch[1]);
                                                        }
                                                    }
                                                    
                                                    // Generate indices in reverse order
                                                    for (let i = startValue; i > endValue; i--) {
                                                        indices.push(i);
                                                    }
                                                } else {
                                                    // Forward loop: iterate from 0 to length-1
                                                    let endValue = arrayLength - 1;
                                                    if (usesLessThanOrEqual) {
                                                        endValue = arrayLength; // <= length means include length (but will check bounds)
                                                    }
                                                    
                                                    // Generate indices in forward order
                                                    for (let i = 0; i <= endValue; i++) {
                                                        indices.push(i);
                                                    }
                                                }
                                                
                                                indices.forEach(idx => {
                                                    if (errorOccurred) return;
                                                    
                                                    // Check for out-of-bounds access
                                                    if (idx < 0 || idx >= arrayLength) {
                                                        const errorMsg = language === 'java' 
                                                            ? `IndexOutOfBoundsException: Index ${idx} out of bounds for length ${arrayLength}`
                                                            : `RangeError: Index ${idx} out of bounds for length ${arrayLength}`;
                                                        result.error = errorMsg;
                                                        result.output.push(language === 'java' 
                                                            ? `Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: Index ${idx} out of bounds for length ${arrayLength}`
                                                            : `RangeError: Index ${idx} out of bounds for length ${arrayLength}`);
                                                        errorOccurred = true;
                                                        return;
                                                    }
                                                    
                                                    const val = valuesArray[idx];
                                                    // Build output by replacing array access with actual value
                                                    let finalOutput = '';
                                                    const parts = content.split(/\s*\+\s*/);
                                                    parts.forEach(part => {
                                                        part = part.trim();
                                                        const arrAccessMatch = part.match(/(\w+)\s*\[\s*\w+\s*\]/);
                                                        if (arrAccessMatch && arrAccessMatch[1] === arrVarName) {
                                                            // Replace arr[i] with actual value
                                                            // Handle undefined, null, 0, and empty string cases
                                                            if (val !== undefined) {
                                                                finalOutput += String(val);
                                                            }
                                                        } else {
                                                            // This is a string literal
                                                            const cleaned = part.replace(/^["']|["']$/g, '').replace(/`/g, '');
                                                            finalOutput += cleaned;
                                                        }
                                                    });
                                                    // Always push output (even if empty, to show the format string)
                                                    result.output.push(finalOutput);
                                                });
                                            } else {
                                                // Array exists but has no elements - still process format string
                                                let finalOutput = '';
                                                const parts = content.split(/\s*\+\s*/);
                                                parts.forEach(part => {
                                                    part = part.trim();
                                                    const arrAccessMatch = part.match(/(\w+)\s*\[\s*\w+\s*\]/);
                                                    if (!arrAccessMatch || arrAccessMatch[1] !== arrVarName) {
                                                        // This is a string literal
                                                        const cleaned = part.replace(/^["']|["']$/g, '').replace(/`/g, '');
                                                        finalOutput += cleaned;
                                                    }
                                                });
                                                if (finalOutput.trim() !== '') {
                                                    result.output.push(finalOutput);
                                                }
                                            }
                                        }
                                    }
                                }
                            });
                        }
                    });
                    
                    // Only generate default output if no println was found in loops
                    if (!loopOutputGenerated) {
                        result.arrayDeclarations.forEach(arr => {
                            if (arr.values) {
                                if (Array.isArray(arr.values)) {
                                    arr.values.forEach((val, idx) => {
                                        if (val !== undefined) {
                                            result.output.push(`${arr.name}[${idx}] = ${val}`);
                                        }
                                    });
                                } else if (Object.keys(arr.values).length > 0) {
                                    for (let key in arr.values) {
                                        const idx = parseInt(key);
                                        if (!isNaN(idx) && arr.values[key] !== undefined) {
                                            result.output.push(`${arr.name}[${idx}] = ${arr.values[key]}`);
                                        }
                                    }
                                }
                            }
                        });
                    }
                }
                
            } catch (error) {
                result.error = error.message;
            }
            
            return result;
        }
    </script>
    <script>
        class ArrayVisualizer extends BaseVisualizer {
            constructor() {
                super();
                this.capacity = 0; // Start with 0 capacity - empty array
                this.size = 0;
                this.data = []; // Initialize data array
                this.language = 'javascript'; // 'java' or 'javascript'
                this.errorMessage = null;
                this.arrays = []; // Store multiple arrays: [{name, type, size, capacity, data, language}, ...]
            }

            getOperations() {
                if (this.language === 'java') {
                    return [
                        { name: 'add', label: 'Add Element', type: 'primary' },
                        { name: 'remove', label: 'Remove at Index', type: 'danger' },
                        { name: 'search', label: 'Search Value', type: 'success' },
                        { name: 'clear', label: 'Clear', type: 'secondary' }
                    ];
                } else {
                    return [
                        { name: 'add', label: 'Add Element', type: 'primary' },
                        { name: 'remove', label: 'Remove at Index', type: 'danger' },
                        { name: 'search', label: 'Search Value', type: 'success' },
                        { name: 'clear', label: 'Clear', type: 'secondary' }
                    ];
                }
            }

            getExamples() {
                return [
                    { label: '1,2,3,4,5', data: [1, 2, 3, 4, 5] },
                    { label: '1,2,3,4,5,6', data: [1, 2, 3, 4, 5, 6] },
                    { label: 'A,B,C,D', data: ['A', 'B', 'C', 'D'] }
                ];
            }

            executeOperation(op, values, key) {
                this.errorMessage = null;
                
                if (op === 'add' && values.length > 0) {
                    if (this.language === 'java') {
                        // Java: Handle batch input - create array of size needed
                        const index = null; // No index input available
                        
                        // If multiple values provided OR single value with no index (batch mode)
                        // OR if index is explicitly null/empty, treat as batch add
                        if (values.length > 1 || index === null) {
                            // For batch add: calculate total size needed
                            const totalSizeNeeded = this.size + values.length;
                            
                            // Ensure data array exists and is properly sized
                            if (!this.data || !Array.isArray(this.data)) {
                                this.data = new Array(this.capacity || 10);
                            }
                            
                            // For batch add: if array is empty, create exact size; otherwise ensure capacity is enough
                            if (this.size === 0) {
                                // Empty array: create exact size for all values
                                this.capacity = values.length;
                                this.data = new Array(this.capacity);
                            } else if (totalSizeNeeded > this.capacity) {
                                // Array has data: resize to fit existing + new values
                                this.capacity = totalSizeNeeded;
                                
                                // Resize array and copy existing data
                                const newData = new Array(this.capacity);
                                for (let i = 0; i < this.size; i++) {
                                    newData[i] = this.data[i];
                                }
                                this.data = newData;
                            }
                            
                            // Add all values starting from current size
                            for (let idx = 0; idx < values.length; idx++) {
                                const targetIndex = this.size + idx;
                                if (targetIndex >= this.capacity) {
                                    this.errorMessage = `IndexOutOfBoundsException: Cannot add ${values.length} values. Array capacity is ${this.capacity}, need ${totalSizeNeeded}`;
                                    displayTerminalError(this.errorMessage);
                                    this.render();
                                    return;
                                }
                                this.data[targetIndex] = values[idx];
                            }
                            // Update size after adding all values
                            this.size = totalSizeNeeded;
                        } else {
                            // Single value at specific index
                            if (index === null || isNaN(index)) {
                                // If no index specified, add at end
                                if (this.size >= this.capacity) {
                                    this.errorMessage = `IndexOutOfBoundsException: Array is full (capacity: ${this.capacity}). Please increase array size.`;
                                    displayTerminalError(this.errorMessage);
                                    this.render();
                                    return;
                                }
                                this.data[this.size] = values[0];
                                this.size++;
                            } else {
                                if (index < 0 || index >= this.capacity) {
                                    this.errorMessage = `IndexOutOfBoundsException: Index ${index} out of bounds for length ${this.capacity}`;
                                    displayTerminalError(this.errorMessage);
                                    this.render();
                                    return;
                                }
                                
                                // Add at specific index
                                this.data[index] = values[0];
                                if (index >= this.size) {
                                    this.size = index + 1;
                                }
                            }
                        }
                    } else {
                        // JavaScript: Add at end (dynamic) - handles batch automatically
                        values.forEach(v => {
                            this.data[this.size] = v;
                            this.size++;
                            // Dynamically grow capacity if needed
                            if (this.size >= this.capacity) {
                                this.capacity = Math.ceil(this.capacity * 1.5);
                                const newData = new Array(this.capacity);
                                for (let i = 0; i < this.size - 1; i++) {
                                    newData[i] = this.data[i];
                                }
                                newData[this.size - 1] = v;
                                this.data = newData;
                            }
                        });
                    }
                } else if (op === 'remove' && values.length > 0) {
                    const index = parseInt(values[0]);
                    if (this.language === 'java') {
                        if (index < 0 || index >= this.capacity) {
                            this.errorMessage = `IndexOutOfBoundsException: Index ${index} out of bounds for length ${this.capacity}`;
                            displayTerminalError(this.errorMessage);
                            this.render();
                            return;
                        }
                        // In Java, we can't really "remove" from a static array, just set to null/0
                        this.data[index] = undefined;
                        if (index < this.size) {
                            this.size = Math.max(0, index);
                        }
                    } else {
                        if (index >= 0 && index < this.size) {
                            for (let i = index; i < this.size - 1; i++) {
                                this.data[i] = this.data[i + 1];
                            }
                            this.size--;
                            this.data[this.size] = undefined;
                        }
                    }
                } else if (op === 'search' && values.length > 0) {
                    const val = values[0];
                    this.searchValue = val;
                } else if (op === 'clear') {
                    this.size = 0;
                    if (this.language === 'java') {
                        // Reset to original capacity for Java
                        this.capacity = 10;
                        this.data = new Array(this.capacity);
                    } else {
                        this.data = [];
                        this.capacity = 10;
                    }
                }
                this.render();
            }


            render() {
                const container = document.getElementById('visualization');
                
                // If we have arrays from code parsing, render all of them
                if (this.arrays && this.arrays.length > 0) {
                    let html = '';
                    
                    if (this.errorMessage) {
                        html += `<div style="background: var(--danger); color: white; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 600;">
                            ⚠️ ${this.errorMessage}
                        </div>`;
                    }
                    
                    // Render each array
                    this.arrays.forEach((arr, index) => {
                        const arrayType = arr.language === 'java' ? 'Static Array (Java)' : 'Dynamic Array (JavaScript)';
                        const is2D = arr.dimensions === 2;
                        html += `
                            <div class="array-visualization-group">
                                <div class="array-header">
                                    <h3>${arr.name} <span class="array-type-badge">${arr.type}${is2D ? '[][]' : '[]'}</span></h3>
                                </div>
                                <div class="${is2D ? 'array-2d-container' : 'array-container'}" id="arrayViz-${index}"></div>
                            </div>
                        `;
                    });
                    
                    container.innerHTML = html;
                    
                    // Render each array's cells
                    this.arrays.forEach((arr, index) => {
                        const vizContainer = document.getElementById(`arrayViz-${index}`);
                        if (!vizContainer) return;
                        
                        vizContainer.innerHTML = '';
                        
                        if (arr.dimensions === 2) {
                            // Render 2D array as grid
                            if (arr.rows > 0 && arr.cols > 0) {
                                const table = document.createElement('table');
                                table.className = 'array-2d-table';
                                
                                // Create header row with column indices
                                const headerRow = document.createElement('tr');
                                headerRow.appendChild(document.createElement('th')); // Empty corner cell
                                for (let col = 0; col < arr.cols; col++) {
                                    const th = document.createElement('th');
                                    th.textContent = col;
                                    th.className = 'col-index';
                                    headerRow.appendChild(th);
                                }
                                table.appendChild(headerRow);
                                
                                // Create data rows
                                for (let row = 0; row < arr.rows; row++) {
                                    const tr = document.createElement('tr');
                                    
                                    // Row index header
                                    const rowHeader = document.createElement('th');
                                    rowHeader.textContent = row;
                                    rowHeader.className = 'row-index';
                                    tr.appendChild(rowHeader);
                                    
                                    // Data cells
                                    for (let col = 0; col < arr.cols; col++) {
                                        const td = document.createElement('td');
                                        td.className = 'array-2d-cell';
                                        
                                        const rowData = arr.data[row];
                                        const val = rowData && col < rowData.length ? rowData[col] : undefined;
                                        
                                        if (val !== undefined && val !== null) {
                                            td.classList.add('active');
                                            td.textContent = val;
                                        } else {
                                            td.textContent = '∅';
                                        }
                                        
                                        if (this.searchValue && val === this.searchValue) {
                                            td.classList.add('highlight');
                                        }
                                        
                                        tr.appendChild(td);
                                    }
                                    table.appendChild(tr);
                                }
                                
                                vizContainer.appendChild(table);
                            } else {
                                vizContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-light); font-style: italic;">Empty 2D array</div>';
                            }
                        } else {
                            // Render 1D array
                            if (arr.capacity > 0) {
                                for (let i = 0; i < arr.capacity; i++) {
                                    const cell = document.createElement('div');
                                    cell.className = 'array-cell';
                                    if (i < arr.size) {
                                        cell.classList.add('active');
                                    }
                                    if (this.searchValue && arr.data[i] === this.searchValue) {
                                        cell.classList.add('highlight');
                                    }
                                    cell.innerHTML = `
                                        <span class="index">${i}</span>
                                        <span class="value">${arr.data[i] !== undefined ? arr.data[i] : '∅'}</span>
                                    `;
                                    vizContainer.appendChild(cell);
                                }
                            } else {
                                vizContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-light); font-style: italic;">Empty array</div>';
                            }
                        }
                    });
                } else {
                    // Fallback to single array visualization (for manual operations)
                    const arrayType = this.language === 'java' ? 'Static Array (Java)' : 'Dynamic Array (JavaScript)';
                    const description = this.language === 'java' 
                        ? 'Fixed-size array as in Java. Enter multiple values (e.g., 1,2,3,4,5,6) to auto-create array of that size. Or specify index to add at specific position. IndexOutOfBoundsException if accessing invalid indices.'
                        : 'Dynamic array as in JavaScript. Automatically grows when needed. Elements added at the end. Enter multiple values (e.g., 1,2,3,4,5,6) to add them all at once.';
                    
                    container.innerHTML = `
                        <div class="description">
                            <strong>${arrayType}:</strong> ${description}
                        </div>
                        ${this.errorMessage ? `<div style="background: var(--danger); color: white; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 600;">
                            ⚠️ ${this.errorMessage}
                        </div>` : ''}
                        <div class="array-container" id="arrayViz"></div>
                    `;

                    const vizContainer = document.getElementById('arrayViz');
                    if (vizContainer) {
                        vizContainer.innerHTML = '';
                        
                        if (this.capacity > 0) {
                            for (let i = 0; i < this.capacity; i++) {
                                const cell = document.createElement('div');
                                cell.className = 'array-cell';
                                if (i < this.size) {
                                    cell.classList.add('active');
                                }
                                if (this.searchValue && this.data[i] === this.searchValue) {
                                    cell.classList.add('highlight');
                                }
                                cell.innerHTML = `
                                    <span class="index">${i}</span>
                                    <span class="value">${this.data[i] !== undefined ? this.data[i] : '∅'}</span>
                                    ${this.showMemory ? `<span class="memory-addr">0x${(1000 + i * 8).toString(16)}</span>` : ''}
                                `;
                                vizContainer.appendChild(cell);
                            }
                        } else {
                            vizContainer.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-light); font-style: italic;">Array is empty. Run code to visualize array.</div>';
                        }
                    }
                }
                
                this.searchValue = null;
                
                // Render time complexity section separately (below code editor)
                this.renderComplexitySection();
            }
            
            renderComplexitySection() {
                const complexityContainer = document.getElementById('complexitySection');
                if (complexityContainer) {
                    complexityContainer.innerHTML = this.renderComplexity([
                        { operation: 'Access by index', complexity: 'O(1)' },
                        { operation: 'Search', complexity: 'O(n)' },
                        { operation: this.language === 'java' ? 'Insert at index' : 'Insert (at end)', complexity: this.language === 'java' ? 'O(1)' : 'O(1) amortized' },
                        { operation: 'Delete', complexity: 'O(n)' }
                    ]);
                }
            }
        }

        const visualizer = new ArrayVisualizer();

        // Initial render to show empty array state
        // visualizer.render() will update after running default code from editor
        visualizer.render();

        // Theme toggle
        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton();
        }

        function updateThemeButton() {
            const btn = document.querySelector('.theme-toggle');
            if (btn) {
                btn.textContent = document.body.getAttribute('data-theme') === 'dark' 
                    ? '☀️ Light Mode' 
                    : '🌙 Dark Mode';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeButton();
            // Set default language
            if (visualizer) {
                visualizer.language = 'java';
            }
        });
    </script>
