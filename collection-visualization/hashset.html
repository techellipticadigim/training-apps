<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HashSet Visualization - Collection Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-link">← Back to Index</a>
            <h1>🗂️ HashSet</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <div class="control-group">
                    <h3>Input</h3>
                    <div class="input-group">
                        <label for="inputValue">Value</label>
                        <input type="text" id="inputValue" placeholder="e.g., apple">
                    </div>
                </div>

                <div class="control-group">
                    <h3>Operations</h3>
                    <div class="operations" id="operations"></div>
                </div>

                <div class="control-group">
                    <h3>Examples</h3>
                    <div class="examples" id="examples"></div>
                </div>
            </div>

            <div class="visualization-area" id="visualization"></div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        class HashSetVisualizer extends BaseVisualizer {
            constructor() {
                super();
                this.capacity = 16;
                this.buckets = Array(this.capacity).fill(null).map(() => []);
                this.size = 0;
            }

            getOperations() {
                return [
                    { name: 'add', label: 'Add', type: 'primary' },
                    { name: 'contains', label: 'Contains', type: 'success' },
                    { name: 'remove', label: 'Remove', type: 'danger' },
                    { name: 'clear', label: 'Clear', type: 'secondary' }
                ];
            }

            getExamples() {
                return [
                    { label: 'apple,banana', data: ['apple', 'banana'] }
                ];
            }

            hash(key) {
                if (typeof key === 'number') return hashNumber(key, this.capacity);
                return hashString(key, this.capacity);
            }

            executeOperation(op, values, key) {
                const inputValue = document.getElementById('inputValue').value;
                if (op === 'add' && inputValue) {
                    const hashValue = this.hash(inputValue);
                    const bucket = this.buckets[hashValue];
                    if (!bucket.includes(inputValue)) {
                        bucket.push(inputValue);
                        this.size++;
                    }
                } else if (op === 'contains' && inputValue) {
                    const hashValue = this.hash(inputValue);
                    const bucket = this.buckets[hashValue];
                    alert(bucket.includes(inputValue) ? 'Found!' : 'Not found');
                } else if (op === 'remove' && inputValue) {
                    const hashValue = this.hash(inputValue);
                    const bucket = this.buckets[hashValue];
                    const index = bucket.indexOf(inputValue);
                    if (index >= 0) {
                        bucket.splice(index, 1);
                        this.size--;
                    }
                } else if (op === 'clear') {
                    this.buckets = Array(this.capacity).fill(null).map(() => []);
                    this.size = 0;
                }
                this.render();
            }

            render() {
                const container = document.getElementById('visualization');
                container.innerHTML = `
                    <div class="description">
                        <strong>HashSet:</strong> Set implementation using hash table with chaining. No duplicate values.
                        <br>Size: ${this.size}, Capacity: ${this.capacity}
                    </div>
                    <div class="hash-container" id="hashViz"></div>
                    ${this.renderComplexity([
                        { operation: 'Add (average)', complexity: 'O(1)' },
                        { operation: 'Contains (average)', complexity: 'O(1)' },
                        { operation: 'Remove (average)', complexity: 'O(1)' }
                    ])}
                `;

                const vizContainer = document.getElementById('hashViz');
                vizContainer.innerHTML = '<div class="bucket-array" id="buckets"></div>';
                const bucketsContainer = document.getElementById('buckets');
                this.buckets.forEach((bucket, index) => {
                    const bucketDiv = document.createElement('div');
                    bucketDiv.className = 'bucket';
                    bucketDiv.innerHTML = `
                        <div class="bucket-index">${index}</div>
                        <div class="bucket-chain" id="chain-${index}"></div>
                    `;
                    bucketsContainer.appendChild(bucketDiv);
                    const chainContainer = document.getElementById(`chain-${index}`);
                    if (bucket.length === 0) {
                        chainContainer.innerHTML = '<div class="null-marker" style="font-size:0.8rem">empty</div>';
                    } else {
                        bucket.forEach((value, idx) => {
                            const node = document.createElement('div');
                            node.className = 'bucket-node';
                            node.innerHTML = `<div class="key">${value}</div>`;
                            chainContainer.appendChild(node);
                        });
                    }
                });
            }
        }

        const visualizer = new HashSetVisualizer();
        visualizer.render();

        function setupOperations() {
            const opsContainer = document.getElementById('operations');
            opsContainer.innerHTML = '';
            visualizer.getOperations().forEach(op => {
                const btn = document.createElement('button');
                btn.className = `btn btn-${op.type || 'primary'}`;
                btn.textContent = op.label;
                btn.onclick = () => visualizer.executeOperation(op.name);
                opsContainer.appendChild(btn);
            });
        }

        function setupExamples() {
            const examplesContainer = document.getElementById('examples');
            examplesContainer.innerHTML = '';
            visualizer.getExamples().forEach(example => {
                const btn = document.createElement('button');
                btn.className = 'example-btn';
                btn.textContent = example.label;
                btn.onclick = () => {
                    example.data.forEach(v => {
                        document.getElementById('inputValue').value = v;
                        visualizer.executeOperation('add', [v]);
                    });
                };
                examplesContainer.appendChild(btn);
            });
        }

        setupOperations();
        setupExamples();

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton();
        }

        function updateThemeButton() {
            const btn = document.querySelector('.theme-toggle');
            if (btn) {
                btn.textContent = document.body.getAttribute('data-theme') === 'dark' 
                    ? '☀️ Light Mode' 
                    : '🌙 Dark Mode';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.body.setAttribute('data-theme', savedTheme);
            updateThemeButton();
        });
    </script>
</body>
</html>
